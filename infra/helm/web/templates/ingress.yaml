apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: yojnapath-tls
spec:
  domains:
    - {{ .Values.webHost | quote }}
    - {{ .Values.livekitHost | quote }}
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: yojnapath-https-redirect
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yojnapath
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.httpsIPName | quote }}
    networking.gke.io/managed-certificates: yojnapath-tls
    networking.gke.io/v1beta1.FrontendConfig: yojnapath-https-redirect
spec:
  rules:
    - host: {{ .Values.webHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - host: {{ .Values.livekitHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: livekit-signal
                port:
                  number: 7880
