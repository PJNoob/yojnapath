apiVersion: v1
kind: Service
metadata:
  name: livekit-signal
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: signal
      port: 7880
      targetPort: 7880
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-media
  annotations:
    cloud.google.com/l4-rbs: "enabled"
spec:
  type: LoadBalancer
  loadBalancerIP: {{ required "mediaIP is required" .Values.mediaIP | quote }}
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: rtc-udp
      port: 7882
      targetPort: 7882
      protocol: UDP
