name: Verify and deploy web app

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/app/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix src/app/web

      - name: Lint web app
        run: npm run lint --prefix src/app/web

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --extra dev

      - name: Test voice agent
        run: uv run pytest && uv run ruff check .

  deploy-preview:
    name: Deploy preview
    needs: verify
    if: inputs.target == 'preview'
    runs-on: ubuntu-latest
    environment: preview
    defaults:
      run:
        working-directory: src/app/web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/app/web/package-lock.json

      - name: Pull Vercel preview settings
        run: npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        run: npx vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        run: npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"

  deploy-production:
    name: Deploy production
    needs: verify
    if: inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: src/app/web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/app/web/package-lock.json

      - name: Pull Vercel production settings
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
